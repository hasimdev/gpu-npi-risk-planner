<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPU NPI Risk Planner</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --ink:#1d1d1b; --muted:#6b6b66; --line:#e2e2dc; --bar:#4a6fa5; --late:#c0563f; --ok:#2f7d4f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161615; --card:#20201e; --ink:#ececea; --muted:#9a9a94; --line:#33332f; --bar:#7d9fd1; --late:#e07a62; --ok:#5cb37f; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, sans-serif; }
  main { max-width:960px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; }
  .controls { display:flex; flex-wrap:wrap; gap:16px; align-items:end; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  label { display:flex; flex-direction:column; font-size:13px; color:var(--muted); gap:4px; }
  select, input { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); }
  button { font:inherit; padding:7px 16px; border-radius:6px; border:0; background:var(--bar); color:#fff; cursor:pointer; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin:16px 0; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .tile .k { font-size:13px; color:var(--muted); }
  .tile .v { font-size:26px; font-weight:600; font-variant-numeric:tabular-nums; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-top:12px; }
  h2 { font-size:15px; margin:0 0 10px; }
  svg { width:100%; height:auto; display:block; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  td, th { text-align:left; padding:6px 4px; border-bottom:1px solid var(--line); font-size:14px; }
  th { color:var(--muted); font-weight:500; }
  .meter { height:8px; background:var(--line); border-radius:4px; overflow:hidden; min-width:80px; }
  .meter span { display:block; height:100%; background:var(--bar); }
  .note { color:var(--muted); font-size:13px; margin-top:16px; }
</style>
</head>
<body>
<main>
  <h1>GPU NPI Risk Planner</h1>
  <p class="sub">Monte Carlo of supplier lead times for a GPU board. All inputs are illustrative assumptions, not supplier data.</p>

  <div class="controls">
    <label>Scenario <select id="scenario"></select></label>
    <label>Target launch (week) <input id="target" type="number" min="1" max="104" step="1"></label>
    <label>Extra packaging slip (weeks) <input id="slip" type="number" min="0" max="26" step="1" value="0"></label>
    <label>Trials <select id="samples"><option>10000</option><option selected>100000</option><option>1000000</option></select></label>
    <button id="run">Run</button>
  </div>

  <div class="tiles">
    <div class="tile"><div class="k">P(on time)</div><div class="v" id="pon">–</div></div>
    <div class="tile"><div class="k">P50 launch</div><div class="v" id="p50">–</div></div>
    <div class="tile"><div class="k">P80 launch</div><div class="v" id="p80">–</div></div>
    <div class="tile"><div class="k">P90 launch</div><div class="v" id="p90">–</div></div>
  </div>

  <div class="card">
    <h2>Distribution of launch-ready week</h2>
    <svg id="hist" viewBox="0 0 900 260" role="img" aria-label="Histogram of simulated launch weeks"></svg>
  </div>

  <div class="card">
    <h2>Critical path: share of trials where each part sets the pace</h2>
    <table><thead><tr><th>Part</th><th>Tier</th><th style="width:40%">Share</th><th></th></tr></thead><tbody id="crit"></tbody></table>
  </div>

  <p class="note" id="meta"></p>
</main>
<script>
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

async function init() {
  const s = await (await fetch('/api/scenarios')).json();
  $('scenario').innerHTML = s.scenarios.map(n => `<option>${n}</option>`).join('');
  $('target').value = s.target_weeks;
  $('run').onclick = run;
  run();
}

async function run() {
  const q = new URLSearchParams({ scenario:$('scenario').value, target_weeks:$('target').value,
    packaging_slip_weeks:$('slip').value, samples:$('samples').value });
  const t0 = performance.now();
  const r = await (await fetch('/api/simulate?' + q)).json();
  const ms = performance.now() - t0;
  $('pon').textContent = (r.p_on_time * 100).toFixed(1) + '%';
  $('pon').style.color = r.p_on_time >= 0.8 ? css('--ok') : css('--late');
  for (const k of ['p50','p80','p90']) $(k).textContent = 'wk ' + r.launch_weeks[k].toFixed(1);
  drawHist(r);
  $('crit').innerHTML = r.critical_path.map(c => `<tr><td>${c.name}</td><td>${c.tier}</td>
    <td><div class="meter"><span style="width:${(c.critical_share*100).toFixed(1)}%"></span></div></td>
    <td>${(c.critical_share*100).toFixed(1)}%</td></tr>`).join('');
  $('meta').textContent = `${r.samples.toLocaleString()} trials on ${r.backend}, round trip ${ms.toFixed(0)} ms.`;
}

function drawHist(r) {
  const { counts, edges } = r.histogram, W = 900, H = 260, P = 32;
  const max = Math.max(...counts), lo = edges[0], hi = edges[edges.length - 1];
  const x = v => P + (v - lo) / (hi - lo) * (W - 2 * P), bw = (W - 2 * P) / counts.length;
  let s = '';
  counts.forEach((c, i) => {
    const h = c / max * (H - 2 * P), late = edges[i] >= r.target_weeks;
    s += `<rect x="${P + i * bw + 1}" y="${H - P - h}" width="${bw - 2}" height="${h}" fill="${late ? css('--late') : css('--bar')}" rx="2"/>`;
  });
  if (r.target_weeks >= lo && r.target_weeks <= hi) {
    const tx = x(r.target_weeks);
    s += `<line x1="${tx}" x2="${tx}" y1="${P - 10}" y2="${H - P}" stroke="${css('--ink')}" stroke-dasharray="4 3"/>`;
    s += `<text x="${tx + 6}" y="${P - 2}" fill="${css('--ink')}" font-size="13">target wk ${r.target_weeks}</text>`;
  }
  for (let i = 0; i <= 5; i++) {
    const v = lo + (hi - lo) * i / 5;
    s += `<text x="${x(v)}" y="${H - 10}" fill="${css('--muted')}" font-size="12" text-anchor="middle">${v.toFixed(0)}</text>`;
  }
  $('hist').innerHTML = s;
}
init();
</script>
</body>
</html>
